[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-plus"
dynamic = ["version"]
description = "Minimalist, secure, highly efficient GitHub MCP companion optimized for web-based AI agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anvilary" }]
dependencies = [
    "fastmcp>=4.2,<5",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
git-plus = "git_plus.cli:main"
git-plus-runner = "git_plus.sandbox:main"

[tool.setuptools.dynamic]
version = { attr = "git_plus.__version__" }

[tool.setuptools.packages.find]
include = ["git_plus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
