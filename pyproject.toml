[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-plus"
version = "0.1.0"
description = "Minimalist, secure, highly efficient GitHub MCP companion optimized for web-based AI agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anvilary" }]
dependencies = [
    "fastmcp>=3.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
git-plus = "git_plus.cli:main"

[tool.setuptools.packages.find]
include = ["git_plus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
