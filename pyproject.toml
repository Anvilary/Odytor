[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odytor"
dynamic = ["version"]
description = "Odytor: GitHub operations, optimized for AI agents. A lightweight MCP companion for pull request investigation, CI diagnosis, conflict inspection, precise fixes and isolated test execution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anvilary Tools" }]
dependencies = [
    "fastmcp>=4.2,<5",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
odytor = "odytor.cli:main"
odytor-runner = "odytor.sandbox:main"
# Temporary aliases for existing installations and the runner host's forced command; removed before the first release.
git-plus = "odytor.cli:main"
git-plus-runner = "odytor.sandbox:main"

[tool.setuptools.dynamic]
version = { attr = "odytor.__version__" }

[tool.setuptools.packages.find]
include = ["odytor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
