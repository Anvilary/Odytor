# /etc/ssh/sshd_config.d/60-git-plus-runner.conf
# The runner account accepts one key, from /etc/ssh/ (root-owned, so the account cannot change it),
# and can do exactly one thing: run the forced command. No shell, pty, forwarding, agent, X11 or rc files. PermitUserEnvironment is global and defaults to no.
Match User gp-runner
    AuthorizedKeysFile /etc/ssh/git-plus-runner.authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/libexec/git-plus-runner-entry
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
    MaxSessions 2
    ClientAliveInterval 15
    ClientAliveCountMax 3
