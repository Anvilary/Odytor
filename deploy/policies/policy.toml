# Maintainer test policy: repositories not listed here cannot be tested. Requirements files sit beside this file.

[templates.standard-python]
profile = "python-pytest"
test_dirs = ["tests"]
requirements = "smoke-test.requirements.txt"
profiles = ["python-pytest", "python-lint", "python-typecheck", "python-build"]

[templates.standard-polyglot]
profile = "python-pytest"
test_dirs = ["tests"]
requirements = "smoke-test.requirements.txt"
profiles = [
    "python-pytest", "python-lint", "python-typecheck", "python-build",
    "node-test", "node-lint", "node-typecheck", "node-build",
    "cmake-build", "make-build", "c-test"
]

[repos."example-org/webapp"]
profile = "python-pytest"
test_dirs = ["tests"]
requirements = "example-webapp.requirements.txt"

[repos."example-org/webapp".node-test]
test_dirs = ["tests"]

[repos."example-org/webapp".playwright-spec]
specs = [
    "tests/e2e/notes-qa/notes-qa-regressions.spec.mjs",
    "tests/e2e/notes-qa/notes-edge-cases.spec.mjs",
]
spec_dirs = ["tests/e2e/notes-qa"]
launcher = "tests/e2e/notes-qa/run_notes_qa.py"
config = "tests/e2e/notes-qa/playwright.config.js"

[repos."example-org/webapp".browser-playwright]
kind = "static"
root = "static"
port = 8765
ready_path = "/index.html"

[repos."example-org/webapp".browser-playwright.profiles.default]
kind = "static"
root = "static"
port = 8765
ready_path = "/index.html"

[repos."example-org/webapp".browser-playwright.profiles.cookbook]
kind = "static"
root = "static"
port = 8765
ready_path = "/index.html"

[repos."example-org/webapp".browser-playwright.profiles.app]
kind = "command"
argv = ["python3", "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "8765"]
port = 8765
ready_path = "/index.html"
ready_timeout = 10

[repos."example-org/webapp".publish]
exempt_paths = [
    "frontend/src/features/notes/application/noteSession.js",
    "static/js/features/notes/application/noteSession.js",
]

[repos."example-org/polyglot-service"]
template = "standard-polyglot"
test_dirs = ["tests"]
requirements = "smoke-test.requirements.txt"

[repos."example-org/polyglot-service".node-test]
test_dirs = ["tests"]

[repos."example-org/polyglot-service".browser-playwright]
kind = "static"
root = "."
port = 8765
ready_path = "/index.html"
