# Maintainer test policy: repositories not listed here cannot be tested. Requirements files sit beside this file.

[templates.standard-python]
profile = "python-pytest"
test_dirs = ["tests"]
requirements = "smoke-test.requirements.txt"
profiles = ["python-pytest", "python-lint", "python-typecheck", "python-build"]

[templates.standard-polyglot]
profile = "python-pytest"
test_dirs = ["tests"]
requirements = "smoke-test.requirements.txt"
profiles = [
    "python-pytest", "python-lint", "python-typecheck", "python-build",
    "node-test", "node-lint", "node-typecheck", "node-build",
    "cmake-build", "make-build", "c-test"
]

[repos."odysseus-dev/odysseus"]
profile = "python-pytest"
test_dirs = ["tests"]
requirements = "odysseus-dev-odysseus.requirements.txt"

[repos."odysseus-dev/odysseus".node-test]
test_dirs = ["tests"]

[repos."odysseus-dev/odysseus".browser-playwright]
kind = "static"
root = "static"
port = 8765
ready_path = "/index.html"

[repos."odysseus-dev/odysseus".browser-playwright.profiles.default]
kind = "static"
root = "static"
port = 8765
ready_path = "/index.html"

[repos."odysseus-dev/odysseus".browser-playwright.profiles.cookbook]
kind = "static"
root = "static"
port = 8765
ready_path = "/index.html"

[repos."odysseus-dev/odysseus".browser-playwright.profiles.app]
kind = "command"
argv = ["python3", "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "8765"]
port = 8765
ready_path = "/index.html"
ready_timeout = 10

[repos."alteixeira20/odytor-smoke-test"]
template = "standard-polyglot"
test_dirs = ["tests"]
requirements = "smoke-test.requirements.txt"

[repos."alteixeira20/odytor-smoke-test".node-test]
test_dirs = ["tests"]

[repos."alteixeira20/odytor-smoke-test".browser-playwright]
kind = "static"
root = "."
port = 8765
ready_path = "/index.html"
